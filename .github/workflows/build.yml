name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Клонируем репозиторий
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Устанавливаем Java
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. Устанавливаем системные зависимости
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev \
          build-essential ccache

    # 5. Устанавливаем buildozer и cython
    - name: Install buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    # 6. Кэшируем buildozer (ускоряет повторные сборки)
    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    # 7. Собираем APK
    - name: Build APK with buildozer
      run: |
        buildozer -v android debug
      continue-on-error: false

    # 8. Загружаем APK как артефакт
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: egephysics-apk
        path: bin/*.apk
        retention-days: 30

    # 9. Загружаем логи если что-то пошло не так
    - name: Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: buildozer-logs
        path: .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/python3/*/python3/obj/local/*/objs/**/*.log
        retention-days: 7