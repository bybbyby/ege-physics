<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Офлайн-режим</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #888;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #283593;
            transform: scale(1.02);
        }
        .offline-symbol {
            font-size: 60px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">📡</span>
        <h1>Нет соединения</h1>
        <p>Проверьте подключение к интернету.<br>
        Некоторые данные могут быть недоступны в офлайн-режиме.</p>
        <button class="btn" onclick="location.reload()">🔄 Попробовать снова</button>
        <div style="margin-top: 20px; color: #555; font-size: 14px;">
            💡 Ранее загруженные вопросы доступны офлайн
        </div>
    </div>
</body>
</html>
